name: CI-Windows-MSVC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.0.3'

    - name: Check cmake version
      run: cmake --version

    - name: Configure CMake
      run: |
        cmake --preset msvc-2022
      shell: cmd

    - name: Build
      run: |
        cmake --build --preset msvc-2022 --config Debug
      shell: cmd

    - name: Test
      run: |
        ctest --preset msvc-2022 -C Debug
      shell: cmd
